<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFDBC8">
    <meta name="description" content="Aplikasi Berakhlak Cerdas Berprestasi">
    
    <link rel="icon" type="image/png" href="https://i.imgur.com/NIlN3oW.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/NIlN3oW.png">

    <title>Sakti App - Berakhlak Cerdas Berprestasi</title>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: '#9A4500',
                        onPrimary: '#FFFFFF',
                        primaryContainer: '#FFDBC8',
                        onPrimaryContainer: '#321200',
                        surface: '#FFF8F6',
                        surfaceVariant: '#F5DED8',
                        outline: '#85736E',
                        secondary: '#77574E',
                    },
                    borderRadius: {
                        '4xl': '32px',
                    },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(154, 69, 0, 0.1)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FFF8F6;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Card Interactions */
        .app-card {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
        }
        .app-card:active {
            transform: scale(0.96);
            box-shadow: none;
        }

        /* Simple Ripple */
        .ripple { position: relative; overflow: hidden; }
        .ripple::after {
            content: ""; display: block; position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none;
            background-image: radial-gradient(circle, #000 10%, transparent 10.01%);
            background-repeat: no-repeat; background-position: 50%; transform: scale(10, 10); opacity: 0; transition: transform .5s, opacity 1s;
        }
        .ripple:active::after { transform: scale(0, 0); opacity: 0.1; transition: 0s; }
    </style>
</head>
<body class="text-onPrimaryContainer min-h-screen flex flex-col relative overflow-hidden">

    <div class="fixed top-[-100px] left-[-100px] w-80 h-80 bg-primaryContainer rounded-full blur-3xl opacity-50 z-0 pointer-events-none"></div>
    <div class="fixed bottom-[-50px] right-[-50px] w-64 h-64 bg-orange-200 rounded-full blur-3xl opacity-50 z-0 pointer-events-none"></div>

    <main class="flex-grow flex flex-col px-6 py-6 z-10 max-w-md mx-auto w-full h-full">
        
        <header class="flex items-center gap-4 mb-10 mt-4">
            <div class="w-16 h-16 rounded-2xl bg-white p-2 shadow-soft border border-orange-100 flex items-center justify-center shrink-0">
                <img src="https://i.imgur.com/NIlN3oW.png" alt="Logo" class="w-full h-full object-contain">
            </div>
            <div>
                <h1 class="text-3xl font-bold text-gray-800 leading-tight">Sakti App</h1>
                <p class="text-secondary text-sm font-medium">Berakhlak Cerdas Berprestasi</p>
            </div>
        </header>

        <div class="space-y-5 flex-grow">
            <a href="https://iwan4943.github.io/eksis/index.html" class="block">
                <div class="app-card ripple bg-[#FFF4DE] p-6 rounded-4xl relative overflow-hidden group border border-orange-100/50 shadow-soft">
                    <div class="absolute top-4 right-4 w-12 h-12 bg-[#FFD180] rounded-full flex items-center justify-center text-[#5D4037]">
                        <span class="material-symbols-rounded text-2xl">sentiment_satisfied</span>
                    </div>
                    
                    <div class="mt-8 relative z-10">
                        <div class="w-12 h-12 mb-3 bg-white rounded-2xl flex items-center justify-center shadow-sm">
                            <span class="material-symbols-rounded text-3xl text-orange-600">face</span>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-900 mb-1">EKSIS</h3>
                        <p class="text-gray-600 text-sm font-medium leading-relaxed">Emoji Kepuasan Siswa<br>& Kebiasaan Baik</p>
                    </div>
                    
                    <div class="absolute -bottom-8 -right-8 w-32 h-32 bg-[#FFE0B2] rounded-full opacity-50 group-active:scale-150 transition-transform duration-500"></div>
                </div>
            </a>

            <a href="https://onelabszz.github.io/jurnalgtk/phone.html" class="block">
                <div class="app-card ripple bg-[#FFDBCC] p-6 rounded-4xl relative overflow-hidden group border border-orange-100/50 shadow-soft">
                    <div class="absolute top-4 right-4 w-12 h-12 bg-[#FFAB91] rounded-full flex items-center justify-center text-[#3E2723]">
                        <span class="material-symbols-rounded text-2xl">edit_document</span>
                    </div>

                    <div class="mt-8 relative z-10">
                        <div class="w-12 h-12 mb-3 bg-white rounded-2xl flex items-center justify-center shadow-sm">
                            <span class="material-symbols-rounded text-3xl text-red-600">menu_book</span>
                        </div>
                        <h3 class="text-2xl font-bold text-gray-900 mb-1">Jurnal GTK</h3>
                        <p class="text-gray-600 text-sm font-medium leading-relaxed">Laporan Kinerja Guru<br>& Monitoring KS</p>
                    </div>

                    <div class="absolute -bottom-8 -right-8 w-32 h-32 bg-[#FFCCBC] rounded-full opacity-50 group-active:scale-150 transition-transform duration-500"></div>
                </div>
            </a>
        </div>

        <footer class="mt-8 mb-4 text-center">
            <p class="text-orange-900/40 text-xs font-medium tracking-wide">2026 | Aplikasi SD Negeri 3 Krisak</p>
        </footer>

    </main>
</body>
</html>
