<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EKSIS IFP - Mode Kelas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FF9000', 
                        primaryDark: '#e65100',
                        secondary: '#334155',
                        surface: '#fdfbf7',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'bounce-slow': 'bounce 3s infinite',
                    }
                }
            }
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #fdfbf7; font-family: 'Inter', sans-serif; overflow: hidden; user-select: none; }
        .hidden-view { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        
        /* Efek Tombol Besar IFP */
        .btn-emoji-big { transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .btn-emoji-big:active { transform: scale(0.85); }
        
        /* Loader */
        .loader-dots div { animation-timing-function: cubic-bezier(0, 1, 1, 0); }
        .loader-dots div:nth-child(1) { left: 8px; animation: loader-dots1 0.6s infinite; }
        .loader-dots div:nth-child(2) { left: 8px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(3) { left: 32px; animation: loader-dots2 0.6s infinite; }
        .loader-dots div:nth-child(4) { left: 56px; animation: loader-dots3 0.6s infinite; }
        @keyframes loader-dots1 { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes loader-dots3 { 0% { transform: scale(1); } 100% { transform: scale(0); } }
        @keyframes loader-dots2 { 0% { transform: translate(0, 0); } 100% { transform: translate(24px, 0); } }
    </style>
</head>
<body class="text-slate-800 h-screen w-screen flex flex-col relative overflow-hidden bg-slate-50">

    <audio id="sfx-puk" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>
    <audio id="sfx-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>

    <div id="loading-overlay" class="hidden-view fixed inset-0 bg-white/95 z-[100] flex items-center justify-center backdrop-blur-sm flex-col">
        <div class="loader-dots relative w-24 h-6 transform scale-150">
            <div class="absolute top-0 w-3 h-3 rounded-full bg-primary"></div>
            <div class="absolute top-0 w-3 h-3 rounded-full bg-primary"></div>
            <div class="absolute top-0 w-3 h-3 rounded-full bg-primary"></div>
            <div class="absolute top-0 w-3 h-3 rounded-full bg-primary"></div>
        </div>
        <div id="loading-text" class="mt-8 text-xl font-bold text-slate-400 tracking-widest uppercase">MEMUAT DATA...</div>
    </div>

    <div id="view-setup" class="h-full flex items-center justify-center bg-gradient-to-br from-orange-400 to-orange-600 p-10 relative">
        <div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(#fff 2px, transparent 2px); background-size: 40px 40px;"></div>
        
        <div class="bg-white/95 backdrop-blur-xl w-full max-w-4xl p-12 rounded-[3rem] shadow-2xl border-4 border-white/30 flex gap-12 items-center fade-in">
            <div class="flex-1 text-center border-r border-slate-200 pr-12">
                <div class="w-32 h-32 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mx-auto mb-6 shadow-inner animate-bounce-slow">
                    <i data-lucide="smile" class="w-16 h-16"></i>
                </div>
                <h1 class="text-5xl font-black text-slate-800 mb-2">EKSIS IFP</h1>
                <p class="text-xl text-slate-500 font-medium">Emoji Kepuasan Siswa</p>
                <div class="mt-8 bg-orange-50 px-6 py-3 rounded-2xl inline-block">
                    <p class="text-orange-700 font-bold uppercase tracking-wider text-sm">Mode Publik / Kelas</p>
                </div>
            </div>
            
            <div class="flex-[1.5] space-y-6">
                <div>
                    <label class="block text-slate-500 font-bold text-sm uppercase tracking-wider mb-2">1. Pilih Kelas</label>
                    <select id="setup-kelas" class="w-full p-6 bg-slate-50 border-2 border-slate-200 rounded-2xl text-2xl font-bold text-slate-800 focus:border-primary outline-none transition-colors">
                        <option value="">-- Pilih Kelas --</option>
                        </select>
                </div>
                <div>
                    <label class="block text-slate-500 font-bold text-sm uppercase tracking-wider mb-2">2. Pilih Mata Pelajaran</label>
                    <select id="setup-mapel" class="w-full p-6 bg-slate-50 border-2 border-slate-200 rounded-2xl text-2xl font-bold text-slate-800 focus:border-primary outline-none transition-colors">
                        <option value="Tematik">Tematik (Guru Kelas)</option>
                        <option value="PJOK">PJOK</option>
                        <option value="PAI">Pendidikan Agama Islam</option>
                        <option value="B.Inggris">Bahasa Inggris</option>
                        <option value="Matematika">Matematika</option>
                        <option value="Seni">Seni Budaya</option>
                        <option value="Mulok">Muatan Lokal</option>
                    </select>
                </div>
                <button onclick="startSession()" class="w-full py-6 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl text-2xl font-black shadow-xl hover:shadow-2xl hover:-translate-y-1 active:scale-95 transition-all flex items-center justify-center gap-3 mt-4">
                    MULAI PELAJARAN <i data-lucide="arrow-right" class="w-8 h-8"></i>
                </button>
            </div>
        </div>
    </div>

    <div id="view-survey" class="hidden-view h-full flex flex-col relative bg-[#fdfbf7]">
        <div class="h-24 px-8 flex items-center justify-between bg-white border-b border-slate-200 shadow-sm z-10">
            <div class="flex items-center gap-4">
                <div class="px-6 py-2 bg-slate-800 text-white rounded-xl font-black text-xl tracking-wider" id="lbl-header-kelas">KELAS -</div>
                <div class="text-slate-400 font-bold text-lg" id="lbl-header-mapel">Mapel</div>
            </div>
            <div class="text-slate-300 font-bold text-xl" id="lbl-counter">0/0</div>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center relative p-8">
            
            <div class="text-center mb-10 fade-in w-full max-w-4xl">
                <div class="inline-block px-8 py-3 bg-white border border-slate-200 rounded-full text-2xl font-bold text-slate-400 mb-4 shadow-sm" id="lbl-nama-lengkap">
                    Nama Lengkap Siswa
                </div>
                <h2 class="text-[5rem] font-black text-slate-800 leading-none tracking-tight mb-2" id="lbl-panggilan">
                    Panggilan
                </h2>
                <p class="text-xl text-slate-400 animate-pulse font-medium">Silakan pilih emojimu hari ini!</p>
            </div>

            <div class="grid grid-cols-4 gap-8 w-full max-w-6xl px-4">
                <button onclick="saveEmoji('Sangat Senang')" class="btn-emoji-big group bg-green-50 hover:bg-green-100 border-4 border-green-200 hover:border-green-400 rounded-[3rem] aspect-square flex flex-col items-center justify-center gap-4 shadow-lg hover:shadow-2xl">
                    <div class="text-[7rem] group-hover:scale-110 transition-transform filter drop-shadow-sm">🤩</div>
                    <span class="text-2xl font-black text-green-700 uppercase tracking-widest">Senang</span>
                </button>
                <button onclick="saveEmoji('Paham')" class="btn-emoji-big group bg-blue-50 hover:bg-blue-100 border-4 border-blue-200 hover:border-blue-400 rounded-[3rem] aspect-square flex flex-col items-center justify-center gap-4 shadow-lg hover:shadow-2xl">
                    <div class="text-[7rem] group-hover:scale-110 transition-transform filter drop-shadow-sm">😊</div>
                    <span class="text-2xl font-black text-blue-700 uppercase tracking-widest">Paham</span>
                </button>
                <button onclick="saveEmoji('Biasa Saja')" class="btn-emoji-big group bg-amber-50 hover:bg-amber-100 border-4 border-amber-200 hover:border-amber-400 rounded-[3rem] aspect-square flex flex-col items-center justify-center gap-4 shadow-lg hover:shadow-2xl">
                    <div class="text-[7rem] group-hover:scale-110 transition-transform filter drop-shadow-sm">😐</div>
                    <span class="text-2xl font-black text-amber-700 uppercase tracking-widest">Biasa</span>
                </button>
                <button onclick="saveEmoji('Bingung/Sedih')" class="btn-emoji-big group bg-red-50 hover:bg-red-100 border-4 border-red-200 hover:border-red-400 rounded-[3rem] aspect-square flex flex-col items-center justify-center gap-4 shadow-lg hover:shadow-2xl">
                    <div class="text-[7rem] group-hover:scale-110 transition-transform filter drop-shadow-sm">😢</div>
                    <span class="text-2xl font-black text-red-700 uppercase tracking-widest">Bingung</span>
                </button>
            </div>

        </div>

        <div class="h-20 bg-white border-t border-slate-200 flex items-center justify-between px-8">
            <div class="flex items-center gap-4">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest bg-slate-100 px-3 py-1 rounded">Menu Guru:</span>
                <button onclick="markAbsen('Sakit')" class="px-6 py-2 rounded-xl bg-orange-50 text-orange-600 font-bold border border-orange-200 hover:bg-orange-100 active:scale-95 transition">Sakit</button>
                <button onclick="markAbsen('Izin')" class="px-6 py-2 rounded-xl bg-blue-50 text-blue-600 font-bold border border-blue-200 hover:bg-blue-100 active:scale-95 transition">Izin</button>
                <button onclick="markAbsen('Alpha')" class="px-6 py-2 rounded-xl bg-red-50 text-red-600 font-bold border border-red-200 hover:bg-red-100 active:scale-95 transition">Alpha</button>
            </div>
            <div class="flex gap-3">
                <button onclick="navSiswa(-1)" class="w-12 h-12 flex items-center justify-center rounded-full border border-slate-300 text-slate-400 hover:bg-slate-100"><i data-lucide="chevron-left" class="w-6 h-6"></i></button>
                <button onclick="navSiswa(1)" class="w-12 h-12 flex items-center justify-center rounded-full border border-slate-300 text-slate-400 hover:bg-slate-100"><i data-lucide="chevron-right" class="w-6 h-6"></i></button>
            </div>
        </div>
    </div>

    <div id="view-finish" class="hidden-view h-full flex items-center justify-center bg-[#fdfbf7] relative">
         <div class="text-center w-full max-w-2xl fade-in">
             <div class="mb-8 relative">
                 <div class="absolute inset-0 bg-yellow-400 blur-[60px] opacity-20 rounded-full"></div>
                 <i data-lucide="party-popper" class="w-32 h-32 text-orange-500 mx-auto relative z-10 animate-bounce"></i>
             </div>
             <h2 class="text-5xl font-black text-slate-800 mb-4">Selesai!</h2>
             <p class="text-2xl text-slate-500 mb-12">Data telah tersimpan. Silakan cek aplikasi guru untuk detail.</p>
             
             <div class="grid grid-cols-2 gap-4 mb-12">
                 <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-lg">
                     <span class="block text-4xl font-black text-slate-800" id="res-total">0</span>
                     <span class="text-sm font-bold text-slate-400 uppercase">Siswa Hadir</span>
                 </div>
                 <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-lg">
                     <span class="block text-4xl font-black text-slate-800" id="res-absen">0</span>
                     <span class="text-sm font-bold text-slate-400 uppercase">Tidak Hadir</span>
                 </div>
             </div>

             <button onclick="resetApp()" class="w-full py-5 bg-slate-800 text-white rounded-2xl text-xl font-bold hover:bg-slate-700 active:scale-95 transition shadow-xl">
                 KEMBALI KE DEPAN (RESET)
             </button>
         </div>
    </div>

    <script>
        // CONFIG
        const API_URL = "https://script.google.com/macros/s/AKfycbw0uCEkQec7b_ZU_cakKU1yHDyKrhEhOYyrUxa6baewPsWGkVZDV5b6nQFxOqu0ziOe/exec"; 
        
        // STATE
        let SESSION = { kelas: "", mapel: "" };
        let STUDENTS = [];
        let IDX = 0;
        let STATS = { hadir: 0, absen: 0 };

        // UTILS
        const $ = (id) => document.getElementById(id);
        const playSfx = (id) => { try { let a=$(id); a.currentTime=0; a.play().catch(()=>{}); } catch(e){} };

        // --- CORE FUNCTIONS ---

        window.onload = async function() {
            lucide.createIcons();
            // Load Kelas list on start
            $('loading-overlay').classList.remove('hidden-view');
            try {
                // Fetch list kelas from API for dropdown
                const response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getKelas" })
                });
                const data = await response.json();
                if(data) {
                    let s = $('setup-kelas');
                    data.forEach(k => {
                        let opt = document.createElement('option');
                        opt.value = k; opt.text = k;
                        s.add(opt);
                    });
                }
            } catch(e) {
                alert("Gagal koneksi internet!");
            }
            $('loading-overlay').classList.add('hidden-view');
        };

        async function startSession() {
            let k = $('setup-kelas').value;
            let m = $('setup-mapel').value;
            
            if(!k || !m) { alert("Mohon pilih Kelas dan Mapel!"); return; }
            
            SESSION.kelas = k;
            SESSION.mapel = m;
            
            // UI Transition
            $('loading-text').innerText = "MENYIAPKAN KELAS " + k + "...";
            $('loading-overlay').classList.remove('hidden-view');
            
            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "getSiswa", kelas: k })
                });
                const data = await res.json();
                
                $('loading-overlay').classList.add('hidden-view');
                
                if(data && data.length > 0) {
                    STUDENTS = data;
                    IDX = 0;
                    STATS = { hadir: 0, absen: 0 };
                    
                    // Setup UI Survey
                    $('lbl-header-kelas').innerText = k;
                    $('lbl-header-mapel').innerText = m;
                    $('view-setup').classList.add('hidden-view');
                    $('view-survey').classList.remove('hidden-view');
                    
                    renderStudent();
                } else {
                    alert("Data siswa kosong untuk kelas ini!");
                }
            } catch(e) {
                $('loading-overlay').classList.add('hidden-view');
                alert("Error mengambil data siswa.");
            }
        }

        function renderStudent() {
            if(IDX >= STUDENTS.length) {
                finishSession();
                return;
            }
            
            let s = STUDENTS[IDX];
            $('lbl-panggilan').innerText = s.panggilan;
            $('lbl-panggilan').className = "text-[5rem] font-black leading-none tracking-tight mb-2 " + (s.gender === "L" ? "text-blue-600" : "text-pink-500");
            
            $('lbl-nama-lengkap').innerText = (IDX + 1) + ". " + s.nama_lengkap;
            $('lbl-counter').innerText = (IDX + 1) + " / " + STUDENTS.length;
        }

        function saveEmoji(emojiValue) {
            playSfx('sfx-puk');
            
            // Kirim data di background (fire and forget agar cepat di UI)
            sendData(emojiValue, "");
            
            STATS.hadir++;
            nextStudent();
        }

        function markAbsen(type) {
            // Konfirmasi ringan
            if(confirm(`Tandai ${STUDENTS[IDX].panggilan} sebagai ${type}?`)) {
                sendData(type, "Input Guru");
                STATS.absen++;
                nextStudent();
            }
        }

        function sendData(val, note) {
            let s = STUDENTS[IDX];
            let payload = {
                nis: s.nis,
                nama: s.nama_lengkap,
                kelas: SESSION.kelas,
                mapel: SESSION.mapel,
                emoji: val,
                ket: note,
                guru: "IFP_KIOSK" // Penanda bahwa ini input dari IFP
            };
            
            // Kita tidak await fetch agar UI tidak macet menunggu server
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "simpanEmoji", data: payload })
            }).catch(e => console.log("Gagal kirim background", e));
        }

        function navSiswa(dir) {
            if(dir === -1 && IDX > 0) {
                IDX--;
                renderStudent();
            } else if (dir === 1 && IDX < STUDENTS.length - 1) {
                // Skip manual (tanpa simpan data)
                IDX++;
                renderStudent();
            }
        }

        function nextStudent() {
            // Efek transisi sederhana
            let container = $('view-survey');
            container.style.opacity = '0';
            setTimeout(() => {
                IDX++;
                renderStudent();
                container.style.opacity = '1';
            }, 200);
        }

        function finishSession() {
            playSfx('sfx-win');
            $('view-survey').classList.add('hidden-view');
            $('view-finish').classList.remove('hidden-view');
            
            $('res-total').innerText = STATS.hadir;
            $('res-absen').innerText = STATS.absen;
        }

        function resetApp() {
            location.reload();
        }

    </script>
</body>
</html>
